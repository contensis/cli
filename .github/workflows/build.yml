name: Build and publish prerelease

on:
  workflow_call:

jobs:
  node:
    if: contains(github.event.head_commit.message, '[nobuild]') != true
    name: npm@prerelease
    uses: ./.github/workflows/build.node.yml
    secrets: inherit

  docker:
    # skip when this push IS the release merge - the release workflow rebuilds
    # and owns the latest/release/version tags (avoids the retag race with it)
    if: contains(github.event.head_commit.message, '[nobuild]') != true && needs.node.outputs.releases_created != 'true'
    name: ghcr.io:latest
    # technically does not require node/build and could run in parallel
    needs: node
    uses: ./.github/workflows/build.docker.yml
    secrets: inherit

  exe:
    if: contains(github.event.head_commit.message, '[nobuild]') != true
    name: exe
    needs: node
    uses: ./.github/workflows/build.exe.yml
    secrets: inherit
