name: Build release container
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to build and tag (e.g. "1.0.0-beta.0" or "2.1.0")'
        required: true

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/${{ github.repository }}/${{ github.event.repository.default_branch || github.ref_name }}/app

jobs:
  release:
    name: Build release image and push
    runs-on: ubuntu-latest
    steps:
      # github.sha resolves to the release target commit on `release` events
      # and to the dispatched ref on `workflow_dispatch`, so the image is always
      # built from the exact sources being released (no retag of mutable :latest)
      - uses: actions/checkout@v7

      - name: Log into container registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image and push release, version and latest tags
        id: build
        env:
          BUILDER_IMAGE: ${{ env.APP_IMAGE }}:builder
          BUILD_IMAGE: ${{ env.APP_IMAGE }}:build-${{ github.run_number }}
          LATEST_IMAGE: ${{ env.APP_IMAGE }}:latest
          RELEASE_IMAGE: ${{ env.APP_IMAGE }}:release
          VERSION_IMAGE: ${{ env.APP_IMAGE }}:${{ inputs.version }}
        run: |
          echo "Pulling images to use for build cache: $BUILDER_IMAGE $LATEST_IMAGE"
          echo "{\"commitRef\":\"${{ github.sha }}\",\"pipelineIID\":\"${{ github.run_id }}\",\"pipelineUrl\":\"${{ github.event.repository.html_url }}/actions/runs/${{ github.run_id }}\",\"buildNo\":\"${{ github.run_number }}\",\"branchName\":\"${{ github.event.repository.default_branch || github.ref_name }}\",\"registryImage\":\"${{ env.APP_IMAGE }}\"}" > version.json
          if [ -n "$(docker pull $BUILDER_IMAGE || echo "")" ]; then echo "Builder image exists: $BUILDER_IMAGE"; fi
          if [ -n "$(docker pull $LATEST_IMAGE || echo "")" ]; then echo "Latest app image exists: $LATEST_IMAGE"; fi
          docker build -t $BUILDER_IMAGE --cache-from $BUILDER_IMAGE --build-arg builder_image=$BUILDER_IMAGE --target prepare -f Dockerfile .
          docker build -t $RELEASE_IMAGE -t $VERSION_IMAGE -t $LATEST_IMAGE -t $BUILD_IMAGE --cache-from $LATEST_IMAGE --build-arg builder_image=$BUILDER_IMAGE -f Dockerfile .
          docker push --all-tags ${{ env.APP_IMAGE }}
          echo "image-uri=$BUILD_IMAGE" >> $GITHUB_OUTPUT
